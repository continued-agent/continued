name: Main Branch Build

# Download and republish VS Code extension artifacts when code is merged to main
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_pr_number:
        description: "PR number to test with"
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  republish-pr-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pr-checks currently publishes the Linux build only. Do not request
        # artifacts that the producer workflow cannot create.
        platform: [Linux]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # Get the last 2 commits to find the merge commit

      - name: Get merged PR number
        id: get-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_PR_NUMBER: ${{ inputs.test_pr_number }}
        run: |
          if [ -n "$TEST_PR_NUMBER" ]; then
            if [[ ! "$TEST_PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "test_pr_number must be a numeric PR number" >&2
              exit 1
            fi
            PR_NUMBER="$TEST_PR_NUMBER"
            echo "Using manually selected PR: #$PR_NUMBER"
          else
            # Get the PR number for the merge commit using GitHub's API.
            COMMIT_SHA="$GITHUB_SHA"
            echo "Getting PR for commit: $COMMIT_SHA"

            PR_NUMBER=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$COMMIT_SHA/pulls" \
              | jq -r '.[0].number // empty')
          fi

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "No PR is associated with $COMMIT_SHA; skipping artifact republish."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Find PR workflow run
        id: find-run
        if: steps.get-pr.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Getting branch name for PR #$PR_NUMBER..."

          # Resolve the exact PR head SHA so an older successful branch run
          # cannot be republished for a newer merge.
          PR_HEAD_SHA=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json headRefName,headRefOid \
            --jq '.headRefName + "\n" + .headRefOid')
          BRANCH_NAME="${PR_HEAD_SHA%%$'\n'*}"
          PR_HEAD_SHA="${PR_HEAD_SHA#*$'\n'}"

          if [ -z "$BRANCH_NAME" ]; then
            echo "❌ Could not find PR #$PR_NUMBER"
            exit 1
          fi

          if [ -z "$PR_HEAD_SHA" ]; then
            echo "❌ Could not resolve the head SHA for PR #$PR_NUMBER"
            exit 1
          fi
          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "❌ PR head SHA has an unexpected format"
            exit 1
          fi

          echo "Branch name: $BRANCH_NAME"
          echo "PR head SHA: $PR_HEAD_SHA"

          # Get a successful run for this exact PR head SHA. The workflow file
          # is hyphenated; the old underscore name caused a 404.
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow="pr-checks.yaml" \
            --commit="$PR_HEAD_SHA" \
            --limit 100 \
            --json databaseId,status,conclusion,headSha \
            | jq -r --arg sha "$PR_HEAD_SHA" '.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success") | .databaseId' \
            | head -1)

          if [ -z "$RUN_ID" ]; then
            echo "❌ No successful workflow run found for PR #$PR_NUMBER (branch: $BRANCH_NAME)"
            exit 1
          fi

          echo "Found successful workflow run for $PR_HEAD_SHA: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Download PR artifact
        if: steps.find-run.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.find-run.outputs.run_id }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📥 Downloading vscode-extension-build-$PLATFORM artifact from run $RUN_ID..."

          # Create temporary directory for download
          mkdir -p ./temp-download

          # Download the artifact from the PR workflow run
          if ! gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "vscode-extension-build-$PLATFORM" \
            --dir "./temp-download"; then
            echo "❌ Failed to download artifact vscode-extension-build-$PLATFORM from run $RUN_ID"
            exit 1
          fi

          echo "✅ Successfully downloaded artifact"

      - name: Republish as main branch artifact
        if: steps.find-run.outputs.run_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-build-${{ matrix.platform }}
          path: ./temp-download/*
