name: CLI Release Artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cli-release-artifact.yml"
      - "core/**"
      - "extensions/cli/**"
      - "packages/**"
      - "scripts/build-packages.js"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
  workflow_dispatch:

concurrency:
  group: cli-release-artifact
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish CLI artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extensions/cli/package-lock.json

      - name: Setup packages
        uses: ./.github/actions/setup-packages

      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        working-directory: core
        run: npm run build

      - name: Install CLI dependencies
        working-directory: extensions/cli
        run: npm ci --include=optional

      - name: Build CLI
        working-directory: extensions/cli
        env:
          CONTINUE_RELEASE_BUILD: "true"
        run: npm run build

      - name: Run CLI tests
        working-directory: extensions/cli
        env:
          CONTINUE_RELEASE_BUILD: "true"
        run: |
          npm test
          npm run test:smoke

      - name: Create release package
        working-directory: extensions/cli
        shell: bash
        env:
          CONTINUE_RELEASE_BUILD: "true"
        run: |
          rm -f "$RUNNER_TEMP"/continued-cli.tgz "$RUNNER_TEMP"/continued-cli.tgz.sha256
          # Build metadata and source maps are useful locally but are not
          # runtime files and make the public artifact unnecessarily large.
          rm -f dist/meta.json dist/*.map
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          package_path="$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package_path"
          cp "$package_path" "$RUNNER_TEMP/continued-cli.tgz"
          (
            cd "$RUNNER_TEMP"
            sha256sum continued-cli.tgz > continued-cli.tgz.sha256
          )

      - name: Verify installed CLI artifact
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          npm install --prefix "$smoke_dir" \
            "$RUNNER_TEMP/continued-cli.tgz" \
            --ignore-scripts \
            --omit=dev
          "$smoke_dir/node_modules/.bin/cn" --version

      - name: Publish latest fork release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="cli-latest"
          release_title="Continued CLI (latest fork build)"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            # Upload before retagging so an upload failure leaves the existing
            # release/tag pair intact instead of pointing at missing assets.
            gh release upload "$release_tag" \
              "$RUNNER_TEMP/continued-cli.tgz" \
              "$RUNNER_TEMP/continued-cli.tgz.sha256" \
              --clobber
            # Remove assets published by older fork builds so the mutable
            # release contains one canonical name for each public artifact.
            for legacy_asset in continue-cli.tgz continue-cli.tgz.sha256; do
              if gh release view "$release_tag" --json assets --jq '.assets[].name' | grep -Fxq "$legacy_asset"; then
                gh release delete-asset "$release_tag" "$legacy_asset" --yes
              fi
            done
            # cli-latest is intentionally mutable, but its tag must point at
            # the same commit as the assets to preserve provenance.
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$release_tag" \
              -f sha="$GITHUB_SHA" \
              -F force=true
          else
            gh release create "$release_tag" \
              "$RUNNER_TEMP/continued-cli.tgz" \
              "$RUNNER_TEMP/continued-cli.tgz.sha256" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "Prebuilt Continued CLI artifact from the main branch. The installer downloads the assets from this release." \
              --prerelease
          fi
